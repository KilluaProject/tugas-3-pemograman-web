<template id="tpl-modal">
    <div v-if="visible" class="fixed inset-0 z-50 bg-slate-900/60 flex items-center justify-center p-4"
        @click.self="close">
        <div class="bg-white rounded-xl max-w-md w-full p-6 shadow-2xl border border-slate-100">
            <div class="flex items-center gap-3 mb-3">
                <span class="inline-flex items-center justify-center w-7 h-7 rounded-full"
                    :class="tone === 'danger' ? 'bg-red-100 text-red-700' : tone === 'warning' ? 'bg-amber-100 text-amber-700' : 'bg-emerald-100 text-emerald-700'">
                    <svg v-if="tone === 'success'" class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M5 13l4 4L19 7"></path>
                    </svg>
                    <span v-else class="text-xs font-bold">!</span>
                </span>
                <h3 class="text-base font-bold text-slate-800" v-text="title"></h3>
            </div>
            <p class="text-sm text-slate-600 leading-relaxed mb-6">{{ message }}</p>
            <div class="flex justify-end gap-2">
                <button @click="close"
                    class="px-4 py-2 bg-slate-200 hover:bg-slate-300 text-slate-700 text-sm font-semibold rounded-lg transition">
                    {{ onConfirmCallback ? 'Batal' : 'Tutup' }}
                </button>
                <button v-if="onConfirmCallback" @click="confirmAction"
                    class="px-4 py-2 bg-red-600 hover:bg-red-700 text-white text-sm font-semibold rounded-lg shadow-xs transition">
                    Ya, Hapus Data
                </button>
            </div>
        </div>
    </div>
</template>
