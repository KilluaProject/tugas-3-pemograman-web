<template id="tpl-stock">
    <div class="space-y-6">
        <!-- Watcher Alert Info -->
        <div v-show="watcherLog"
            class="bg-blue-50 border-l-4 border-utblue p-4 rounded-r-lg shadow-xs flex items-center gap-3">
            <div class="text-sm text-slate-700">
                <strong class="text-utblue">Info Sistem:</strong> <span v-text="watcherLog"></span>
            </div>
        </div>

        <!-- Card Filter & Sort -->
        <div class="bg-white rounded-xl shadow-xs border border-slate-200/90 p-5">
            <div class="flex flex-wrap justify-between items-center gap-2 mb-4">
                <div>
                    <h3 class="text-base font-bold text-slate-800">Filter & Pengurutan Stok</h3>
                    <p class="text-xs text-slate-500 mt-0.5">Saring bahan ajar berdasarkan UT-Daerah, kategori, dan ketersediaan</p>
                </div>
                <button @click="resetFilter"
                    class="px-3 py-1.5 bg-slate-100 hover:bg-slate-200 text-slate-700 text-xs font-medium rounded-lg transition border border-slate-200">
                    Reset Filter
                </button>
            </div>

            <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4 items-end">
                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1">UT-Daerah (UPBJJ):</label>
                    <select v-model="selectedUpbjj"
                        class="w-full px-3 py-2 text-sm border border-slate-300 rounded-lg focus:outline-none focus:ring-1 focus:ring-utblue focus:border-utblue bg-white">
                        <option value="">Semua UT-Daerah</option>
                        <option v-for="(daerah, idx) in upbjjList" :key="idx" :value="daerah">{{ daerah }}</option>
                    </select>
                </div>

                <!-- Dependent Options: Hanya muncul jika UT-Daerah dipilih -->
                <div v-if="selectedUpbjj !== ''">
                    <label class="block text-xs font-semibold text-slate-600 mb-1">Kategori Mata Kuliah:</label>
                    <select v-model="selectedKategori"
                        class="w-full px-3 py-2 text-sm border border-blue-300 bg-blue-50/40 rounded-lg focus:outline-none focus:ring-1 focus:ring-utblue focus:border-utblue">
                        <option value="">Semua Kategori di {{ selectedUpbjj }}</option>
                        <option v-for="(kat, idx) in availableKategori" :key="idx" :value="kat">{{ kat }}</option>
                    </select>
                </div>

                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1">Urutan (Sort):</label>
                    <select v-model="sortBy"
                        class="w-full px-3 py-2 text-sm border border-slate-300 rounded-lg focus:outline-none focus:ring-1 focus:ring-utblue focus:border-utblue bg-white">
                        <option value="">Default (Urutan Data)</option>
                        <option value="judul-asc">Judul Mata Kuliah (A - Z)</option>
                        <option value="judul-desc">Judul Mata Kuliah (Z - A)</option>
                        <option value="qty-asc">Jumlah Stok (Terkecil - Terbesar)</option>
                        <option value="qty-desc">Jumlah Stok (Terbesar - Terkecil)</option>
                        <option value="harga-asc">Harga (Termurah - Termahal)</option>
                        <option value="harga-desc">Harga (Termahal - Termurah)</option>
                    </select>
                </div>

                <div class="pb-0.5">
                    <label
                        class="inline-flex items-center gap-2 cursor-pointer select-none bg-amber-50/80 border border-amber-200/80 px-3 py-2 rounded-lg w-full transition hover:bg-amber-100/50">
                        <input type="checkbox" v-model="filterReorder" class="w-4 h-4 accent-utblue rounded">
                        <span class="text-xs font-semibold text-amber-900">Perlu Re-order (Stok &lt; Safety atau = 0)</span>
                    </label>
                </div>
            </div>
        </div>

        <!-- Card Tabel Daftar Stok -->
        <div class="bg-white rounded-xl shadow-xs border border-slate-200/90 p-5">
            <div class="mb-4">
                <div class="flex items-center justify-between">
                    <h3 class="text-base font-bold text-slate-800">Daftar Stok Bahan Ajar</h3>
                    <span class="text-xs font-semibold text-slate-500 bg-slate-100 px-2.5 py-1 rounded-full">
                        Total: {{ filteredAndSortedStok.length }} Data
                    </span>
                </div>
                <p class="text-xs text-slate-500 mt-1">
                    Arahkan kursor pada badge <strong class="text-slate-700">Status</strong> untuk melihat catatan. Tekan <strong class="text-slate-700">Enter</strong> pada kolom input untuk menyimpan edit.
                </p>
            </div>

            <div v-if="editError"
                class="mb-3 p-3 bg-red-50 border border-red-200 text-red-700 text-xs font-medium rounded-lg">
                {{ editError }}
            </div>

            <div class="overflow-x-auto rounded-lg border border-slate-200">
                <table class="w-full text-left border-collapse">
                    <thead>
                        <tr class="bg-slate-50 border-b border-slate-200 text-slate-600 text-[11px] uppercase tracking-wider font-semibold">
                            <th class="py-3 px-3.5 whitespace-nowrap">No</th>
                            <th class="py-3 px-3.5">Kode & Nama Mata Kuliah</th>
                            <th class="py-3 px-3.5 whitespace-nowrap">Kategori</th>
                            <th class="py-3 px-3.5 whitespace-nowrap">UT-Daerah</th>
                            <th class="py-3 px-3.5 whitespace-nowrap">Lokasi Rak</th>
                            <th class="py-3 px-3.5 whitespace-nowrap">Harga</th>
                            <th class="py-3 px-3.5 whitespace-nowrap">Stok</th>
                            <th class="py-3 px-3.5 whitespace-nowrap">Safety</th>
                            <th class="py-3 px-3.5 text-center whitespace-nowrap">Status</th>
                            <th class="py-3 px-3.5 text-center whitespace-nowrap">Aksi</th>
                        </tr>
                    </thead>
                    <tbody class="divide-y divide-slate-100 text-sm">
                        <tr v-if="filteredAndSortedStok.length === 0">
                            <td colspan="10" class="py-12 text-center text-slate-400 italic">
                                Data stok bahan ajar tidak ditemukan.
                            </td>
                        </tr>
                        <tr v-for="(item, index) in filteredAndSortedStok" :key="item.kode"
                            class="hover:bg-slate-50/70 transition">
                            <td class="py-3 px-3.5 font-medium text-slate-400 text-xs">{{ index + 1 }}</td>
                            <td class="py-3 px-3.5">
                                <span class="font-mono font-bold text-utblue text-xs block mb-0.5">{{ item.kode }}</span>
                                <span v-if="editingKode !== item.kode" v-text="item.judul"
                                    class="text-slate-800 font-medium"></span>
                                <input v-else type="text" v-model.trim="editForm.judul" @keyup.enter="simpanEdit(item)"
                                    class="w-full px-2 py-1 text-xs border border-blue-400 rounded focus:outline-none">
                            </td>
                            <td class="py-3 px-3.5 whitespace-nowrap">
                                <span v-if="editingKode !== item.kode"
                                    class="px-2 py-0.5 bg-slate-100 rounded text-xs font-medium text-slate-700">{{
                                    item.kategori }}</span>
                                <select v-else v-model="editForm.kategori" @keyup.enter="simpanEdit(item)"
                                    class="px-2 py-1 text-xs border border-blue-400 rounded">
                                    <option v-for="k in kategoriList" :key="k" :value="k">{{ k }}</option>
                                </select>
                            </td>
                            <td class="py-3 px-3.5 whitespace-nowrap text-slate-700">
                                <span v-if="editingKode !== item.kode">{{ item.upbjj }}</span>
                                <select v-else v-model="editForm.upbjj" @keyup.enter="simpanEdit(item)"
                                    class="px-2 py-1 text-xs border border-blue-400 rounded">
                                    <option v-for="u in upbjjList" :key="u" :value="u">{{ u }}</option>
                                </select>
                            </td>
                            <td class="py-3 px-3.5 whitespace-nowrap">
                                <span v-if="editingKode !== item.kode"
                                    class="font-mono text-xs bg-slate-100 px-2 py-0.5 rounded border border-slate-200 text-slate-700">{{ item.lokasiRak }}</span>
                                <input v-else type="text" v-model.trim="editForm.lokasiRak"
                                    @keyup.enter="simpanEdit(item)"
                                    class="w-20 px-2 py-1 text-xs border border-blue-400 rounded">
                            </td>
                            <td class="py-3 px-3.5 whitespace-nowrap font-medium text-slate-800 text-xs">
                                <span v-if="editingKode !== item.kode">{{ item.harga | formatRupiah }}</span>
                                <input v-else type="number" v-model.number="editForm.harga"
                                    @keyup.enter="simpanEdit(item)"
                                    class="w-24 px-2 py-1 text-xs border border-blue-400 rounded">
                            </td>
                            <td class="py-3 px-3.5 whitespace-nowrap">
                                <span v-if="editingKode !== item.kode" class="font-bold text-slate-800 text-xs">{{ item.qty | formatBuah }}</span>
                                <input v-else type="number" v-model.number="editForm.qty"
                                    @keyup.enter="simpanEdit(item)"
                                    class="w-20 px-2 py-1 text-xs border border-blue-400 rounded">
                            </td>
                            <td class="py-3 px-3.5 whitespace-nowrap text-slate-500 text-xs">
                                <span v-if="editingKode !== item.kode">{{ item.safety | formatBuah }}</span>
                                <input v-else type="number" v-model.number="editForm.safety"
                                    @keyup.enter="simpanEdit(item)"
                                    class="w-20 px-2 py-1 text-xs border border-blue-400 rounded">
                            </td>
                            <td class="py-3 px-3.5 text-center whitespace-nowrap">
                                <status-badge v-if="editingKode !== item.kode" :qty="item.qty" :safety="item.safety"
                                    :catatan-html="item.catatanHTML">
                                </status-badge>
                                <input v-else type="text" v-model="editForm.catatanHTML" @keyup.enter="simpanEdit(item)"
                                    class="w-36 px-2 py-1 text-xs border border-blue-400 rounded"
                                    placeholder="Catatan HTML">
                            </td>
                            <td class="py-3 px-3.5 text-center whitespace-nowrap">
                                <div v-if="editingKode !== item.kode" class="flex justify-center gap-1.5">
                                    <button @click="mulaiEdit(item)"
                                        class="px-2.5 py-1 bg-amber-500 hover:bg-amber-600 text-white text-xs font-medium rounded transition shadow-2xs">
                                        Edit
                                    </button>
                                    <button @click="konfirmasiHapus(item)"
                                        class="px-2.5 py-1 bg-rose-600 hover:bg-rose-700 text-white text-xs font-medium rounded transition shadow-2xs">
                                        Hapus
                                    </button>
                                </div>
                                <div v-else class="flex justify-center gap-1.5">
                                    <button @click="simpanEdit(item)"
                                        class="px-2.5 py-1 bg-emerald-600 hover:bg-emerald-700 text-white text-xs font-medium rounded transition shadow-2xs">
                                        Simpan
                                    </button>
                                    <button @click="batalEdit"
                                        class="px-2.5 py-1 bg-slate-200 hover:bg-slate-300 text-slate-700 text-xs font-medium rounded transition">
                                        Batal
                                    </button>
                                </div>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>

        <!-- Card Formulir Tambah Bahan Ajar Baru -->
        <div class="bg-white rounded-xl shadow-xs border border-slate-200/90 p-5">
            <h3 class="text-base font-bold text-slate-800 mb-1">Tambah Bahan Ajar Baru</h3>
            <p class="text-xs text-slate-500 mb-4">Lengkapi data bahan ajar untuk menambahkan item ke inventaris</p>

            <form @submit.prevent="tambahBahanAjar">
                <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4 mb-5">
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 mb-1">Kode Mata Kuliah *</label>
                        <input type="text" v-model.trim="newItem.kode" placeholder="Contoh: STSI4209"
                            class="w-full px-3 py-2 text-sm border border-slate-300 rounded-lg focus:outline-none focus:ring-1 focus:ring-utblue focus:border-utblue">
                        <p v-if="errors.kode" class="text-red-600 text-xs mt-1">{{ errors.kode }}</p>
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 mb-1">Nama Mata Kuliah *</label>
                        <input type="text" v-model.trim="newItem.judul" placeholder="Contoh: Pemrograman Berbasis Web"
                            class="w-full px-3 py-2 text-sm border border-slate-300 rounded-lg focus:outline-none focus:ring-1 focus:ring-utblue focus:border-utblue">
                        <p v-if="errors.judul" class="text-red-600 text-xs mt-1">{{ errors.judul }}</p>
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 mb-1">Kategori *</label>
                        <select v-model="newItem.kategori"
                            class="w-full px-3 py-2 text-sm border border-slate-300 rounded-lg focus:outline-none focus:ring-1 focus:ring-utblue focus:border-utblue bg-white">
                            <option value="">Pilih Kategori</option>
                            <option v-for="kat in kategoriList" :key="kat" :value="kat">{{ kat }}</option>
                        </select>
                        <p v-if="errors.kategori" class="text-red-600 text-xs mt-1">{{ errors.kategori }}</p>
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 mb-1">UT-Daerah *</label>
                        <select v-model="newItem.upbjj"
                            class="w-full px-3 py-2 text-sm border border-slate-300 rounded-lg focus:outline-none focus:ring-1 focus:ring-utblue focus:border-utblue bg-white">
                            <option value="">Pilih UT-Daerah</option>
                            <option v-for="upbjj in upbjjList" :key="upbjj" :value="upbjj">{{ upbjj }}</option>
                        </select>
                        <p v-if="errors.upbjj" class="text-red-600 text-xs mt-1">{{ errors.upbjj }}</p>
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 mb-1">Lokasi Rak *</label>
                        <input type="text" v-model.trim="newItem.lokasiRak" placeholder="Contoh: R2-A1"
                            class="w-full px-3 py-2 text-sm border border-slate-300 rounded-lg focus:outline-none focus:ring-1 focus:ring-utblue focus:border-utblue">
                        <p v-if="errors.lokasiRak" class="text-red-600 text-xs mt-1">{{ errors.lokasiRak }}</p>
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 mb-1">Harga (Rp) *</label>
                        <input type="number" v-model.number="newItem.harga" placeholder="Contoh: 70000"
                            class="w-full px-3 py-2 text-sm border border-slate-300 rounded-lg focus:outline-none focus:ring-1 focus:ring-utblue focus:border-utblue">
                        <p v-if="errors.harga" class="text-red-600 text-xs mt-1">{{ errors.harga }}</p>
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 mb-1">Jumlah Stok (buah) *</label>
                        <input type="number" v-model.number="newItem.qty" placeholder="Contoh: 25"
                            class="w-full px-3 py-2 text-sm border border-slate-300 rounded-lg focus:outline-none focus:ring-1 focus:ring-utblue focus:border-utblue">
                        <p v-if="errors.qty" class="text-red-600 text-xs mt-1">{{ errors.qty }}</p>
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 mb-1">Safety Stock (buah) *</label>
                        <input type="number" v-model.number="newItem.safety" placeholder="Contoh: 10"
                            class="w-full px-3 py-2 text-sm border border-slate-300 rounded-lg focus:outline-none focus:ring-1 focus:ring-utblue focus:border-utblue">
                        <p v-if="errors.safety" class="text-red-600 text-xs mt-1">{{ errors.safety }}</p>
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 mb-1">Catatan Tambahan (HTML) *</label>
                        <input type="text" v-model.trim="newItem.catatanHTML" placeholder="Contoh: <b>Edisi baru</b>"
                            class="w-full px-3 py-2 text-sm border border-slate-300 rounded-lg focus:outline-none focus:ring-1 focus:ring-utblue focus:border-utblue">
                        <p v-if="errors.catatanHTML" class="text-red-600 text-xs mt-1">{{ errors.catatanHTML }}</p>
                    </div>
                </div>
                <button type="submit"
                    class="px-5 py-2.5 bg-utblue hover:bg-blue-900 text-white text-xs sm:text-sm font-semibold rounded-lg shadow-xs transition">
                    Simpan Bahan Ajar
                </button>
            </form>
        </div>
    </div>
</template>
